.relative{
  position: relative;
}

.sticky{
  position: sticky;
}

.block{
  display: block;
}

.inline{
  display: inline;
}

.flex{
  display: flex;
}

.inline-flex{
  display: inline-flex;
}

.grid{
  display: grid;
}

.transform{
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.resize{
  resize: both;
}

.border{
  border-width: 1px;
}

.blur{
  --tw-blur: blur(8px);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

:root {
  --bg: #070818;
  --bg-2: #0c0e26;
  --surface: #12142f;
  --surface-2: #1a1d42;
  --line: rgba(232, 196, 105, 0.22);
  --line-soft: rgba(255, 255, 255, 0.10);
  --text: #f7f3e8;
  --muted: #a8a9c4;
  --gold: #e8c469;
  --gold-2: #f7df9a;
  --gold-deep: #a87f24;
  --purple: #7c5cff;
  --navy: #0a1030;
  --success: #3ddc97;
  --danger: #ff6b7a;
  --radius: 18px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #070818;
    --surface: #12142f;
    --text: #f7f3e8;
    --muted: #a8a9c4;
  }
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
}

body {
  font-family: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text);
  background:
    radial-gradient(900px 420px at 12% -10%, rgba(124, 92, 255, 0.28), transparent 60%),
    radial-gradient(760px 380px at 95% 8%, rgba(232, 196, 105, 0.16), transparent 55%),
    var(--bg);
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

input, textarea, select {
  font-size: 16px;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

.mono {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
}

.gold-text {
  background: linear-gradient(100deg, #fff3c4 0%, #e8c469 42%, #a87f24 68%, #f7df9a 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.panel {
  background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
}

.chip-btn {
  border: 1px solid var(--line-soft);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  border-radius: 999px;
  padding: 9px 13px;
  min-height: 48px;
  font-weight: 600;
  font-size: 13px;
  transition: all .15s ease;
}

.chip-btn:hover {
  border-color: rgba(232,196,105,.6);
  transform: translateY(-1px);
}

.chip-btn.active {
  background: linear-gradient(135deg, #e8c469, #b98c2a);
  color: #1a1202;
  border-color: #e8c469;
  box-shadow: 0 8px 22px rgba(232,196,105,.22);
}

.field {
  width: 100%;
  background: #0a0c20;
  border: 1px solid var(--line-soft);
  border-radius: 12px;
  color: var(--text);
  padding: 12px 13px;
  font-size: 16px;
  min-height: 48px;
  outline: none;
}

.field:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(232,196,105,.16);
}

.field::-moz-placeholder {
  color: #76789a;
}

.field::placeholder {
  color: #76789a;
}

/* ATM card */

.card-scene {
  perspective: 1200px;
}

.card-flip {
  position: relative;
  width: 100%;
  aspect-ratio: 85 / 54;
  transform-style: preserve-3d;
  transition: transform .65s cubic-bezier(.2,.8,.2,1);
}

.card-flip.flipped {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  border-radius: 18px;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border: 1px solid rgba(232,196,105,.42);
  box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18);
}

.card-front {
  background:
    radial-gradient(320px 180px at 88% 8%, rgba(124,92,255,.55), transparent 60%),
    radial-gradient(280px 200px at 8% 100%, rgba(232,196,105,.18), transparent 55%),
    linear-gradient(115deg, #0a1030 0%, #171542 42%, #3a1f72 72%, #1a1040 100%);
}

.card-back {
  transform: rotateY(180deg);
  background: linear-gradient(115deg, #101335 0%, #241a55 55%, #0d0f2a 100%);
}

.shine {
  position: absolute;
  inset: -20% -40%;
  background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.20) 50%, transparent 58%);
  transform: rotate(4deg);
  pointer-events: none;
}

.chip {
  width: 46px;
  height: 34px;
  border-radius: 7px;
  background: linear-gradient(135deg, #fff0a8, #e8c469 45%, #9a741f 80%, #f7df9a);
  border: 1px solid rgba(90,60,0,.45);
  position: relative;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.45);
  flex-shrink: 0;
}

.chip::before, .chip::after {
  content: "";
  position: absolute;
  background: rgba(90,60,0,.55);
}

.chip::before {
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
}

.chip::after {
  top: 0;
  bottom: 0;
  left: 33%;
  width: 1px;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 999px;
  padding: 4px 9px;
  font-size: 10px;
  letter-spacing: .12em;
  font-weight: 700;
}

.pill-unused {
  background: rgba(61,220,151,.16);
  color: #7df0b8;
  border: 1px solid rgba(61,220,151,.4);
}

.pill-used {
  background: rgba(255,255,255,.09);
  color: #c9cbe0;
  border: 1px solid rgba(255,255,255,.18);
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 999px;
  background: currentColor;
  box-shadow: 0 0 0 4px rgba(61,220,151,.14);
}

.stripe {
  height: 42px;
  background: #05060f;
  margin-top: 18px;
}

.sig-strip {
  height: 34px;
  background: repeating-linear-gradient(115deg, #e9e4d4 0 10px, #d6cfb8 10px 20px);
  color: #222;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 10px;
}

@keyframes pulse-live {
  0%,100% {
    opacity: 1;
  }

  50% {
    opacity: .35;
  }
}

.live-dot {
  animation: pulse-live 1.6s ease-in-out infinite;
}
